name: Fetch Azure Prices

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC every night
  workflow_dispatch:        # manually triggerable from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_prices.py'   # trigger when REGIONS config changes
      - 'trigger/**'                 # trigger via lightweight trigger file

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the CSV back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Azure retail prices
        run: python scripts/fetch_prices.py

      - name: Commit & push updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices/
          # Only commit if something actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update Azure prices $(date -u +%Y-%m-%d)"
          git push
