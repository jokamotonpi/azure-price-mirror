name: Fetch Azure Prices

on:
  schedule:
    - cron: '0 2 * * *'   # nightly — fetches region stored in trigger/run
  workflow_dispatch:        # manually triggerable from the Actions tab
  push:
    branches: [main]
    paths:
      - 'trigger/**'         # Claude updates this with the target region

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # REQUIRED — lets the bot commit the CSV back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read target region from trigger/run
        id: region
        run: |
          REGION=$(cat trigger/run | tr -d '[:space:]')
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "Target region: $REGION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Azure retail prices
        run: python scripts/fetch_prices.py "${{ steps.region.outputs.region }}"

      - name: Commit & push updated CSV
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices/
          # Only commit if something actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update Azure prices ${{ steps.region.outputs.region }} $(date -u +%Y-%m-%d)"
          git push
